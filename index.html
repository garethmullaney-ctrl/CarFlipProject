<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Copart Flip — Deal Book</title>
<style>
  :root{
    --bg:#E7EAEC; --card:#FFFFFF; --ink:#15181B; --muted:#5E6870; --faint:#8b949c;
    --line:#D8DCE0; --line2:#EAECEF;
    --petrol:#0C6E6B; --petrol-tint:#E3F0EF;
    --go:#1E8A54; --go-tint:#E4F3EA;
    --caution:#B9770B; --caution-tint:#FBF0DC;
    --stop:#C03A2E; --stop-tint:#FBE7E4;
    --watch:#3B5BA5; --watch-tint:#E7ECF7;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:clamp(14px,3vw,36px)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  a{color:var(--petrol)}

  /* top nav */
  .topnav{position:sticky;top:0;z-index:20;background:rgba(231,234,236,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topnav .row{max-width:1080px;margin:0 auto;padding:11px clamp(14px,3vw,36px);display:flex;align-items:center;gap:14px}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink)}
  .brand .b2{color:var(--petrol)}
  .back{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:none;cursor:pointer;display:none}
  .back.show{display:inline}
  .navspace{flex:1}
  .navmeta{font-family:var(--mono);font-size:11.5px;color:var(--faint)}

  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--petrol);font-weight:600}

  /* ---------- HOME ---------- */
  .home-mast{padding:8px 0 22px;border-bottom:2px solid var(--ink);margin-bottom:22px}
  .home-mast h1{font-size:clamp(30px,6vw,52px);line-height:.98;letter-spacing:-.035em;font-weight:800;margin-top:6px}
  .home-mast p{color:var(--muted);margin-top:10px;max-width:56ch;font-size:14.5px}
  .sumstrip{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:18px}
  .sumstrip .s{font-family:var(--mono)}
  .sumstrip .s b{font-size:22px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
  .sumstrip .s span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

  .cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.cardgrid{grid-template-columns:1fr}}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;cursor:pointer;
    transition:border-color .12s,transform .12s;display:flex;flex-direction:column;gap:2px;position:relative}
  .ccard:hover{border-color:var(--ink);transform:translateY(-1px)}
  .ccard .catrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .cbadge{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}
  .vchip{font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:2px;border:1.5px solid}
  .ccard h3{font-size:19px;letter-spacing:-.02em;font-weight:700;line-height:1.1}
  .ccard .csub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
  .ccard .cfig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
  .ccard .cfig .f .n{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:-.02em}
  .ccard .cfig .f .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .ccard .open{font-family:var(--mono);font-size:11.5px;color:var(--petrol);margin-top:14px}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
  table.summary{width:100%;border-collapse:collapse;font-size:14px;min-width:660px}
  table.summary th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600}
  table.summary th.num,table.summary td.num{text-align:right}
  table.summary td{padding:14px 16px;border-bottom:1px solid var(--line2);vertical-align:middle;font-variant-numeric:tabular-nums}
  table.summary tbody tr{cursor:pointer;transition:background .1s}
  table.summary tbody tr:hover{background:var(--petrol-tint)}
  table.summary tbody tr:last-child td{border-bottom:0}
  .summary .vh b{font-weight:700;font-size:15px}
  .summary .ys{color:var(--muted);font-weight:500}
  .summary .lm{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px}
  .pend{font-family:var(--mono);font-size:11px;color:var(--faint);font-style:italic}
  .dash{color:var(--faint)}
  .poundpre{font-family:var(--mono);color:var(--muted);font-size:12px;margin-right:1px}
  input.repcell{width:64px;font-family:var(--mono);font-size:13px;text-align:right;border:1px solid var(--line);border-radius:4px;padding:3px 5px;background:var(--card);color:var(--ink);-moz-appearance:textfield}
  input.repcell:hover{border-color:var(--muted)}
  input.repcell:focus{outline:none;border-color:var(--petrol);background:var(--petrol-tint)}
  input.repcell.zero{color:var(--stop);border-color:#eebbb4;background:var(--stop-tint);font-weight:700}
  .tosource{font-family:var(--mono);font-size:11px;color:var(--stop)}
  .plate{font-family:var(--mono);font-weight:800;font-size:11px;letter-spacing:.08em;color:#15181B;background:#f4d64e;border:1px solid #cba82f;border-radius:3px;padding:1px 6px;white-space:nowrap;text-transform:uppercase;vertical-align:middle}
  .plate-lg{font-size:15px;padding:3px 10px;letter-spacing:.1em}
  .cust-name{width:100%;font-size:13.5px;border:1px solid var(--line);border-radius:4px;padding:5px 7px;background:var(--card);color:var(--ink)}
  .cust-name:focus{outline:none;border-color:var(--petrol)}
  .custmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:5px}
  .cust-link{flex:1;min-width:160px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--card);color:var(--muted)}
  .cust-link:focus{outline:none;border-color:var(--petrol)}
  .removelink{font-family:var(--mono);font-size:11px;color:var(--stop);cursor:pointer}
  .removelink:hover{text-decoration:underline}
  tr.addrow td{padding-top:12px}
  .addlink{font-family:var(--mono);font-size:12.5px;color:var(--petrol);cursor:pointer;font-weight:600;display:inline-block;padding:6px 0}
  .addlink:hover{text-decoration:underline}
  tr.customrow td{background:var(--petrol-tint)}
  .repwarn{font-family:var(--mono);font-size:11.5px;color:#8a2a20;background:var(--stop-tint);border:1px solid #eebbb4;border-radius:5px;padding:9px 12px;margin-top:12px;line-height:1.55}
  .edithint{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:12px;line-height:1.55}
  .resetlink{font-family:var(--mono);font-size:11px;color:var(--petrol);cursor:pointer;margin-left:8px;font-weight:400}
  .resetlink:hover{text-decoration:underline}
  .tnote{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.55;max-width:80ch}
  .archwrap{margin-top:26px;border-top:1px solid var(--line);padding-top:8px}
  .archtoggle{font-family:var(--mono);font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;padding:8px 0;letter-spacing:.04em}
  .archtoggle:hover{color:var(--ink)}
  .archbody{margin-top:8px}
  .summary.arch tbody tr{opacity:.6}
  .summary.arch tbody tr:hover{opacity:1;background:var(--stop-tint)}

  /* ---------- DETAIL (shared with SE sheet) ---------- */
  .mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;justify-content:space-between;padding:6px 0 16px;border-bottom:2px solid var(--ink)}
  h1.dt{font-size:clamp(24px,4.2vw,38px);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin-top:4px}
  h1.dt .yr{color:var(--muted);font-weight:500}
  .lotline{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:8px}
  .lotline a{color:var(--petrol);text-decoration:none;border-bottom:1px solid var(--petrol)}
  .verdict-chip{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border-radius:2px;white-space:nowrap;border:1.5px solid}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 24px}
  .chip{font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:2px;background:var(--card);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;gap:6px}
  .chip.good{background:var(--go-tint);border-color:#bfe0cd;color:#14653c}
  .chip.warn{background:var(--caution-tint);border-color:#e9cd97;color:#8a5906}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--go)}
  .chip.warn .dot{background:var(--caution)}

  section{background:var(--card);border:1px solid var(--line);border-radius:5px;margin-bottom:14px;overflow:hidden}
  .sec-head{display:flex;align-items:baseline;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line2)}
  .sec-num{font-family:var(--mono);font-size:12px;color:var(--faint);font-weight:600}
  .sec-title{font-size:14px;font-weight:700}
  .sec-note{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:auto}
  .sec-body{padding:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}.mast{align-items:flex-start}}

  .drow{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
  .drow:last-child{border-bottom:0}
  .drow .k{color:var(--muted)} .drow .v{font-family:var(--mono);text-align:right;font-weight:500}
  .drow.tot{border-top:1.5px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:9px;font-weight:700}
  .neg{color:var(--stop)}
  .subhead{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:2px 0 8px;font-weight:600}

  .scale{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .scale .cell{border:1px solid var(--line);border-radius:4px;padding:12px;text-align:center}
  .scale .cell.mid{border-color:var(--petrol);background:var(--petrol-tint)}
  .scale .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .scale .big{font-family:var(--mono);font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
  .scale .sub{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px}

  svg{display:block;width:100%;height:auto;overflow:visible}
  .ax{font-family:var(--mono);font-size:10px;fill:var(--faint)}
  .gl{stroke:var(--line2);stroke-width:1}

  ul.clean{list-style:none;font-size:13px}
  ul.clean li{padding:6px 0 6px 22px;position:relative;border-bottom:1px solid var(--line2);color:var(--ink)}
  ul.clean li:last-child{border-bottom:0}
  ul.clean li::before{content:"";position:absolute;left:2px;top:12px;width:8px;height:8px;border-radius:50%}
  li.ok::before{background:var(--go)} li.watch::before{background:var(--caution)} li.info::before{background:var(--petrol)}
  li.bad::before{background:var(--stop)}
  .callout{background:var(--go-tint);border:1px solid #bfe0cd;border-radius:4px;padding:11px 13px;font-size:13px;margin-top:12px;color:#14532e}
  .callout b{color:#0f3d22}
  .callout.warn{background:var(--caution-tint);border-color:#e9cd97;color:#7a4f08}
  .callout.warn b{color:#5c3b06}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:right;padding:0 0 8px;font-weight:600;border-bottom:1px solid var(--line)}
  thead th:first-child{text-align:left}
  tbody td{padding:9px 0;border-bottom:1px solid var(--line2);text-align:right;font-family:var(--mono);vertical-align:top}
  tbody td:first-child{text-align:left;font-family:var(--sans)}
  tbody tr.sub td{border-bottom:1.5px solid var(--ink);font-weight:700}
  .partlink{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--petrol);text-decoration:none;border-bottom:1px solid #a9d0cf;margin-top:3px}
  .tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:2px;background:var(--line2);color:var(--muted);margin-left:6px}
  .tag.known{background:var(--caution-tint);color:#8a5906}

  .bl{border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card);margin-bottom:14px}
  .bl-head{background:var(--ink);color:#fff;padding:16px 20px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
  .bl-head h2{font-size:17px;letter-spacing:-.01em;font-weight:800}
  .bl-head .sub{font-family:var(--mono);font-size:11.5px;color:#aeb8c0}
  .bl-body{padding:20px}
  .controls{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center}
  @media(max-width:620px){.controls{grid-template-columns:1fr}}
  .slabel{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:6px}
  .slabel .bv{font-size:24px;font-weight:700;color:var(--ink)}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid #fff;cursor:pointer}
  .toggle{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .toggle button{font-family:var(--mono);font-size:12px;padding:9px 14px;border:0;background:var(--card);color:var(--muted);cursor:pointer}
  .toggle button.on{background:var(--ink);color:#fff;font-weight:600}
  .togwrap{text-align:right}
  .togwrap .cap{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-bottom:6px}
  .allin{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:14px 0 4px;padding-top:14px;border-top:1px solid var(--line2)}
  .allin b{color:var(--ink);font-size:14px}
  .profitgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .pcard{border:1px solid var(--line);border-radius:5px;padding:14px 12px;text-align:center}
  .pcard .plab{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .pcard .psale{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:1px}
  .pcard .pval{font-family:var(--mono);font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
  .pbar{height:6px;border-radius:3px;background:var(--line2);margin-top:10px;overflow:hidden}
  .pbar i{display:block;height:100%;border-radius:3px}
  .verdict{margin-top:16px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:5px;border:1.5px solid}
  .verdict .vt{font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
  .verdict .vd{font-size:13px;line-height:1.45}

  .pending{background:var(--line2);border:1px dashed var(--line);border-radius:5px;padding:16px;font-size:13px;color:var(--muted);font-family:var(--mono)}
  .lede{font-size:14.5px;line-height:1.55;color:var(--ink)}

  footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
  .src{max-width:640px}
</style>
</head>

/* ---- editable repair overrides (saved on this device via localStorage) ---- */
function ovKey(id){return 'cf_ov_'+id;}
function loadOv(id){try{return JSON.parse(localStorage.getItem(ovKey(id)))||{};}catch(e){return{};}}
function saveOv(id,ov){try{localStorage.setItem(ovKey(id),JSON.stringify(ov));}catch(e){}}
function clearOv(id){try{localStorage.removeItem(ovKey(id));}catch(e){}}
function hasOv(id){const o=loadOv(id);return (o&&Object.keys(o).length>0)||loadAdd(id).length>0;}
// custom (user-added) repair lines, saved on device
function addKey(id){return 'cf_add_'+id;}
function loadAdd(id){try{return JSON.parse(localStorage.getItem(addKey(id)))||[];}catch(e){return[];}}
function saveAdd(id,a){try{localStorage.setItem(addKey(id),JSON.stringify(a));}catch(e){}}
function clearAdd(id){try{localStorage.removeItem(addKey(id));}catch(e){}}
// effective per-row value: col 'b' = DIY(best, index1), 'w' = Garage(worst, index2)
function effRow(c,i,col){const ov=loadOv(c.id),d=c.repair.rows[i];const base=col==='b'?d[1]:d[2];const o=ov[i];return (o&&o[col]!=null&&!isNaN(o[col]))?o[col]:base;}
function effSub(c,col){if(!c.repair)return null;let s=0;c.repair.rows.forEach((r,i)=>{s+=effRow(c,i,col);});loadAdd(c.id).forEach(r=>{s+=(+(col==='b'?r.b:r.w)||0);});return s;}
function effRepairDiy(c){return c.repair?effSub(c,'b'):(c.model?c.model.repairDiy:0);}
function effRepairGarage(c){return c.repair?effSub(c,'w'):(c.model?c.model.repairGarage:0);}

function costsOf(c){
  if(!c.model) return null;
  const M=c.model, rep=effRepairDiy(c), cont=Math.round(0.15*rep);
  const fees = M.feePct!=null ? Math.round(c.currentBid*M.feePct)+(M.feeFixed||0) : M.fees;
  return fees+M.transport+M.recommission+rep+cont;
}
function rowHtml(c){
  const vc=vColor(c.verdict), vt=vTint(c.verdict);
  const costs=costsOf(c);
  const isSold = c.sold != null;
  const binCell = c.bin ? fmt(c.bin) : '<span class="dash">—</span>';
  let costCell='<span class="pend">pending</span>', profCell='<span class="pend">—</span>';
  if(isSold){
    costCell = costs!=null ? fmt(costs) : '<span class="dash">—</span>';
    profCell = '<span class="dash">—</span>';
  } else if(costs!=null){
    const profit=c.resale.mid - c.currentBid - costs;
    const col=profit>=800?'var(--go)':profit>=250?'var(--caution)':'var(--stop)';
    costCell=fmt(costs);
    profCell=`<b style="color:${col};font-weight:800">${fmt(profit)}</b>`;
  }
  // "Current bid" column: for a sold lot show the sold price + label, else the live bid
  const bidCell = isSold ? `<b>${fmt(c.sold)}</b><div class="lm">sold price</div>` : fmt(c.currentBid);
  const reg=(c.vrn||(c.history&&c.history.vrn))||null;
  return `<tr onclick="go('${c.id}')">
    <td class="vh"><b>${c.title}</b> <span class="ys">${c.yr}</span>${reg?` <span class="plate">${reg}</span>`:''}<div class="lm">Lot ${c.lot} · ${c.sale}</div></td>
    <td>${c.cat}</td>
    <td class="num">${bidCell}</td>
    <td class="num">${binCell}</td>
    <td class="num">${c.resale?fmt(c.resale.mid):'<span class="dash">—</span>'}</td>
    <td class="num">${costCell}</td>
    <td class="num">${profCell}</td>
    <td><span class="vchip" style="color:${vc};border-color:${vc};background:${vt}">${VT[c.verdict]}</span></td>
  </tr>`;
}

      <span class="sec-note">VRN ${c.history.vrn} · MOT to ${c.history.motTo}</span></div><div class="sec-body"><div class="grid2"><div>`;
    if(c.history.trail){
      h += `<div class="subhead">Mileage — MOT trail (genuine)</div><svg id="mileageChart" viewBox="0 0 520 190"></svg>
        <div class="callout">${c.history.trailNote}</div>`;
    } else {
      h += `<div class="subhead">MOT</div><div class="drow"><span class="k">Valid until</span><span class="v">${c.history.motTo}</span></div>`;
    }
    h += `</div><div><div class="subhead">Copart notes</div>${listBlock(c.history.notes)}
      <div class="subhead" style="margin-top:16px">Advisories &amp; vehicle report</div>${listBlock(c.history.advisories)}</div></div></div></section>`;
  } else if(c.pendingHistory){
    h += `<section><div class="sec-head"><span class="sec-num">03</span><span class="sec-title">History &amp; provenance</span></div>
      <div class="sec-body"><div class="pending">${c.pendingHistory}</div></div></section>`;
  }

  // repair
  if(c.repair){
    const editable = !!c.model && c.sold==null;
    const cell=(i,col)=>{
      const v=editable?effRow(c,i,col):(col==='b'?c.repair.rows[i][1]:c.repair.rows[i][2]);
      const z=(+v===0)?' zero':'';
      return editable
        ? `<td class="num"><span class="poundpre">£</span><input class="repcell${z}" type="number" min="0" step="5" data-i="${i}" data-col="${col}" value="${v}"></td>`
        : `<td class="num"${z?' style="color:var(--stop);font-weight:700"':''}>${fmt(v)}</td>`;
    };
    const rows=c.repair.rows.map((r,i)=>{
      const link=r[4]?`<br><a class="partlink" href="${r[4]}" target="_blank" rel="noopener">${r[5]} →</a>`:(r[5]?`<br><span class="tosource">${r[5]}</span>`:'');
      const tag=r[3]?`<span class="tag known">${r[3]}</span>`:`<span class="tag">unpriced</span>`;
      return `<tr><td>${r[0]}${tag}${link}</td>${cell(i,'b')}${cell(i,'w')}</tr>`;
    }).join('');
    // custom (user-added) rows
    const custRows = editable ? loadAdd(c.id).map((r,j)=>{
      const linkView = r.link?`<a class="partlink" href="${r.link}" target="_blank" rel="noopener">open link →</a>`:'';
      return `<tr class="customrow">
        <td><input class="cust-name" data-ci="${j}" placeholder="Part / job — description" value="${(r.name||'').replace(/"/g,'&quot;')}">
          <div class="custmeta"><input class="cust-link" data-ci="${j}" placeholder="web link (optional)" value="${(r.link||'').replace(/"/g,'&quot;')}"> ${linkView} <a class="removelink" onclick="removeRow('${c.id}',${j})">✕ remove</a></div></td>
        <td class="num"><span class="poundpre">£</span><input class="repcell cust-cost${(+r.b===0)?' zero':''}" type="number" min="0" step="5" data-ci="${j}" data-col="b" value="${r.b||0}"></td>
        <td class="num"><span class="poundpre">£</span><input class="repcell cust-cost${(+r.w===0)?' zero':''}" type="number" min="0" step="5" data-ci="${j}" data-col="w" value="${r.w||0}"></td></tr>`;
    }).join('') : '';
    const addBtn = editable ? `<tr class="addrow"><td colspan="3"><a class="addlink" onclick="addRow('${c.id}')">+ add a repair line</a></td></tr>` : '';
    const sb=editable?effSub(c,'b'):c.repair.subBest, sw=editable?effSub(c,'w'):c.repair.subWorst;
    const reset = (editable&&hasOv(c.id))?`<a class="resetlink" onclick="resetRepair('${c.id}')">reset to defaults</a>`:'';
    const nZero = c.repair.rows.filter((r,i)=>(+effRow(c,i,'b')===0)).length + (editable?loadAdd(c.id).filter(r=>+r.b===0).length:0);
    const warn = nZero ? `<p class="repwarn">⚠ ${nZero} line${nZero>1?'s are':' is'} unpriced (red £0) — still to be sourced. The profit below is <b>best-case</b> until these are filled in.</p>` : '';
    h += `<section><div class="sec-head"><span class="sec-num">04</span><span class="sec-title">Repair — parts &amp; costs</span>
      <span class="sec-note">${c.repair.note}</span></div><div class="sec-body"><table>
      <thead><tr><th>Item</th><th class="num">DIY (best)</th><th class="num">Garage (worst)</th></tr></thead>
      <tbody>${rows}${custRows}${addBtn}<tr class="sub"><td>Repair subtotal ${reset}</td><td class="num" id="subBest">${fmt(sb)}</td><td class="num" id="subWorst">${fmt(sw)}</td></tr></tbody></table>
      ${warn}
      ${editable?`<p class="edithint">Every figure is a real sourced price with a link — tap any to change it, or <b>+ add a repair line</b> for a cost we didn't foresee (with its own link + DIY/Garage price). Saved on <b>this device</b>; red £0 = not sourced yet. Tell me a figure to bake it in for every device.</p>`:''}</div></section>`;
  } else if(c.pendingRepair){
    h += `<section><div class="sec-head"><span class="sec-num">04</span><span class="sec-title">Repair — parts &amp; costs</span></div>
      <div class="sec-body"><div class="pending">${c.pendingRepair}</div></div></section>`;
  }

  // bottom line (interactive) or static verdict
  if(c.model){
    h += `<div class="bl"><div class="bl-head"><h2>Bottom line — what you'd make</h2>
      <span class="sub">drag your bid · toggle who does the bodywork</span></div><div class="bl-body">
      <div class="controls">
        <div><div class="slabel"><span>Your winning bid</span><span class="bv mono" id="bidOut"></span></div>
          <input type="range" id="bid" min="${c.model.bidMin??0}" max="${c.model.bidMax ?? Math.max(2000, Math.ceil((((c.bidGuide&&c.bidGuide.ceiling)||1000)*1.8)/100)*100)}" step="${c.model.bidStep ?? ((((c.bidGuide&&c.bidGuide.ceiling)||1000) > 3000) ? 50 : 25)}" value="${c.model.bidDefault}"></div>
        <div class="togwrap"><span class="cap">Who does the bodywork?</span>
          <div class="toggle" id="repToggle">
            <button data-r="diy" class="on">DIY · <span id="togDiy">${fmt(effRepairDiy(c))}</span></button>
            <button data-r="garage">Garage · <span id="togGarage">${fmt(effRepairGarage(c))}</span></button></div></div></div>
      <div class="allin">All-in to buy &amp; fix: <b id="allInOut"></b><span id="allInBreak" style="color:var(--faint)"></span></div>
      <div class="profitgrid" id="profitGrid"></div>
      <div class="verdict" id="verdict"><span class="vt" id="verdictT"></span><span class="vd" id="verdictD"></span></div>
    </div></div>`;
  }

  document.getElementById('app').innerHTML = h;
  window.scrollTo(0,0);
  if(c.history&&c.history.trail&&c.history.trail.length) drawMileage(c.history.trail);
  if(c.repair && c.model && c.sold==null){ REPAIR_LIVE={diy:effSub(c,'b'),garage:effSub(c,'w')}; wireRepairEdits(c); }
  if(c.model) wireCalc(c);
}

/* ---- editable repair: recompute subtotals, persist, refresh calc ---- */
function wireRepairEdits(c){
  function recalc(){
    // default-row overrides
    const ov=loadOv(c.id);
    document.querySelectorAll('.repcell[data-i]').forEach(inp=>{
      const i=+inp.dataset.i, col=inp.dataset.col;
      let val=parseFloat(inp.value); if(isNaN(val)||val<0) val=0;
      const def=col==='b'?c.repair.rows[i][1]:c.repair.rows[i][2];
      if(!ov[i]) ov[i]={};
      if(Math.round(val)===def){ delete ov[i][col]; if(Object.keys(ov[i]).length===0) delete ov[i]; }
      else ov[i][col]=Math.round(val);
    });
    saveOv(c.id, ov);
    // custom rows
    const add=loadAdd(c.id);
    document.querySelectorAll('.customrow').forEach(tr=>{
      const nameI=tr.querySelector('.cust-name'), j=+nameI.dataset.ci;
      if(!add[j]) add[j]={name:'',link:'',b:0,w:0};
      add[j].name=nameI.value;
      add[j].link=tr.querySelector('.cust-link').value.trim();
      const bI=tr.querySelector('.cust-cost[data-col="b"]'), wI=tr.querySelector('.cust-cost[data-col="w"]');
      add[j].b=Math.max(0,Math.round(parseFloat(bI.value)||0));
      add[j].w=Math.max(0,Math.round(parseFloat(wI.value)||0));
    });
    saveAdd(c.id, add);
    // red-zero styling per cost input
    document.querySelectorAll('.repcell').forEach(inp=>{ inp.classList.toggle('zero', parseFloat(inp.value)===0 || inp.value===''); });
    const sb=effSub(c,'b'), sw=effSub(c,'w');
    document.getElementById('subBest').textContent=fmt(sb);
    document.getElementById('subWorst').textContent=fmt(sw);
    const td=document.getElementById('togDiy'), tg=document.getElementById('togGarage');
    if(td) td.textContent=fmt(sb); if(tg) tg.textContent=fmt(sw);
    REPAIR_LIVE={diy:sb,garage:sw};
    if(REPAINT) REPAINT();
    const rl=document.querySelector('.resetlink');
    if(hasOv(c.id) && !rl){ const cell=document.querySelector('tr.sub td:first-child'); if(cell) cell.insertAdjacentHTML('beforeend',` <a class="resetlink" onclick="resetRepair('${c.id}')">reset to defaults</a>`); }
    if(!hasOv(c.id) && rl){ rl.remove(); }
  }
  document.querySelectorAll('.repcell, .cust-name, .cust-link').forEach(inp=>{ inp.addEventListener('input',recalc); });
}
function addRow(id){ const a=loadAdd(id); a.push({name:'',link:'',b:0,w:0}); saveAdd(id,a); const c=CARS.find(x=>x.id===id); if(c) renderCar(c); }
function removeRow(id,j){ const a=loadAdd(id); a.splice(j,1); saveAdd(id,a); const c=CARS.find(x=>x.id===id); if(c) renderCar(c); }
function resetRepair(id){ clearOv(id); clearAdd(id); const c=CARS.find(x=>x.id===id); if(c) renderCar(c); }

/* ---- interactive calc ---- */
function wireCalc(c){
  const M=c.model; let bid=M.bidDefault, route='diy';
  const BMIN=M.bidMin??0, BMAX=M.bidMax??1500;
  function paint(){
    const repair=route==='diy' ? (REPAIR_LIVE?REPAIR_LIVE.diy:M.repairDiy) : (REPAIR_LIVE?REPAIR_LIVE.garage:M.repairGarage);
    const cont=Math.round(0.15*repair);
    const fees = M.feePct!=null ? Math.round(bid*M.feePct)+(M.feeFixed||0) : M.fees;
    const allIn=bid+fees+M.transport+M.recommission+repair+cont;
    const P={low:M.resale.low-allIn,mid:M.resale.mid-allIn,high:M.resale.high-allIn};
    document.getElementById('bidOut').textContent=fmt(bid);
    document.getElementById('allInOut').textContent=fmt(allIn);
    document.getElementById('allInBreak').textContent=`  = bid ${fmt(bid)} + fees ${fmt(fees)} + transport ${fmt(M.transport)} + repair ${fmt(repair)} + recommission ${fmt(M.recommission)} + contingency ${fmt(cont)}`;
    const pct=((bid-BMIN)/(BMAX-BMIN)*100).toFixed(1);
    document.getElementById('bid').style.background=`linear-gradient(90deg,var(--petrol) 0%,var(--petrol) ${pct}%,var(--line) ${pct}%)`;
    const order=[['low','Low',M.resale.low],['mid','Expected',M.resale.mid],['high','High',M.resale.high]];
    const maxAbs=Math.max(2000,...Object.values(P).map(v=>Math.abs(v)));
    document.getElementById('profitGrid').innerHTML=order.map(([k,lab,sale])=>{
      const v=P[k], col=v>=800?'var(--go)':v>=250?'var(--caution)':'var(--stop)';
      const w=Math.max(3,Math.min(100,Math.abs(v)/maxAbs*100));
      return `<div class="pcard"><div class="plab">${lab} resale</div><div class="psale">${fmt(sale)}</div>
        <div class="pval" style="color:${col}">${fmt(v)}</div><div class="pbar"><i style="width:${w}%;background:${col}"></i></div></div>`;
    }).join('');
    const med=P.mid, tgt=M.targetProfit; let t,d,col,bg,bd;
    if(med>=tgt){t='GO';d=`Clears your ${fmt(tgt)} target in the expected case (${fmt(med)}). Strong at this bid.`;col='var(--go)';bg='var(--go-tint)';bd='#bfe0cd';}
    else if(med>=tgt*0.5){t='OK';d=`Makes ${fmt(med)} expected — short of ${fmt(tgt)} but a fair margin.`;col='var(--caution)';bg='var(--caution-tint)';bd='#e9cd97';}
    else if(med>=0){t='THIN';d=`Only ${fmt(med)} expected — margin's gone unless resale lands high.`;col='var(--stop)';bg='var(--stop-tint)';bd='#eebbb4';}
    else{t='STOP';d=`Loses money in the expected case (${fmt(med)}). Too much to pay.`;col='var(--stop)';bg='var(--stop-tint)';bd='#eebbb4';}
    const vEl=document.getElementById('verdict');vEl.style.background=bg;vEl.style.borderColor=bd;
    document.getElementById('verdictT').textContent=t;document.getElementById('verdictT').style.color=col;
    document.getElementById('verdictD').textContent=d;
    // Masthead shows the live economic call (GO/OK/THIN/STOP @ bid) ONLY for cars that aren't gated.
    // review/pass cars keep their static verdict badge (REVIEW/PASS) so a gated car never reads "GO"
    // just because the money works — the economic call still shows in full in the Bid-guide verdict box below.
    if(c.sold==null && c.verdict!=='review' && c.verdict!=='pass' && c.verdict!=='won'){const mv=document.getElementById('mastVerdict');mv.textContent=t+' @ '+fmt(bid);mv.style.color=col;mv.style.borderColor=col;mv.style.background=bg;}
  }
  document.getElementById('bid').addEventListener('input',e=>{bid=+e.target.value;paint();});
  document.querySelectorAll('#repToggle button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#repToggle button').forEach(x=>x.classList.remove('on'));b.classList.add('on');route=b.dataset.r;paint();}));
  REPAINT=paint;
  paint();
}

/* ---- mileage svg ---- */
function drawMileage(data){
  const W=520,H=190,L=44,R=10,T=14,B=26;
  const xs=data.map(d=>d[0]),ys=data.map(d=>d[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y1=Math.max(...ys);
  const px=v=>L+(v-x0)/(x1-x0)*(W-L-R), py=v=>T+(1-v/(y1*1.08))*(H-T-B);
  let g='';[0,20000,40000].forEach(v=>{const y=py(v);
    g+=`<line class="gl" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="ax" x="${L-6}" y="${y+3}" text-anchor="end">${v/1000?v/1000+'k':'0'}</text>`;});
  [x0,2018,2023,x1].forEach(v=>{g+=`<text class="ax" x="${px(v)}" y="${H-8}" text-anchor="middle">'${String(v).slice(2)}</text>`;});
  const line=data.map((d,i)=>(i?'L':'M')+px(d[0]).toFixed(1)+' '+py(d[1]).toFixed(1)).join(' ');
  const area=`M${px(x0)} ${py(0)} `+data.map(d=>'L'+px(d[0]).toFixed(1)+' '+py(d[1]).toFixed(1)).join(' ')+` L${px(x1)} ${py(0)} Z`;
  const dots=data.map(d=>`<circle cx="${px(d[0]).toFixed(1)}" cy="${py(d[1]).toFixed(1)}" r="2.4" fill="#0C6E6B"/>`).join('');
  const last=data[data.length-1];
  document.getElementById('mileageChart').innerHTML=g+`<path d="${area}" fill="#0C6E6B" opacity="0.08"/><path d="${line}" fill="none" stroke="#0C6E6B" stroke-width="2.2" stroke-linejoin="round"/>`+dots+
    `<text class="ax" x="${px(last[0])}" y="${py(last[1])-8}" text-anchor="end" style="fill:#15181B;font-weight:700">${last[1].toLocaleString()}</text>`;
}

/* ---- router ---- */
function go(id){location.hash = id?('#/'+id):'#/';}
function route(){
  const id=(location.hash.replace(/^#\/?/,'')||'').trim();
  const car=CARS.find(c=>c.id===id);
  if(car) renderCar(car); else renderHome();
}
window.addEventListener('hashchange',route);
route();
</script>
